# ── NeurIPS 2026 — Synthetic data scenario ──
# Test data replaced with causal synthetic CSV preserving market stylized facts.
# Zero look-ahead bias.

# --- Agents to train ---
agents:
  - a2c
  - ppo
  - ddpg
  - td3

# --- DRL hyperparameters (Optuna-tuned, 50 trials, validation 2016–2018) ---
trials: 50

a2c_params:
  learning_rate: 0.00044303752452182633
  n_steps: 256
  gamma: 0.999
  ent_coef: 4.831596208381844e-06

ppo_params:
  learning_rate: 1.3017436180109315e-05
  n_steps: 512
  gamma: 0.95
  clip_range: 0.1
  batch_size: 128

ddpg_params:
  learning_rate: 0.0002690993531147841
  buffer_size: 50000
  batch_size: 64
  tau: 0.001
  gamma: 0.999
  noise_std: 0.1

td3_params:
  learning_rate: 0.0028217853982912605
  buffer_size: 500000
  batch_size: 64
  tau: 0.005
  gamma: 0.99
  policy_delay: 3

# --- Training ---
timesteps_per_model: 1000000
train_seed: 0

# --- Data ---
data_source: "yahoo"
train_data_source: "yahoo"
test_data_source: "synthetic_csv"
test_synthetic_data_path: "synthetic_data.csv"
allow_missing_tickers: true
tickers:
  - AAPL
  - AXP
  - BA
  - BAC
  - CAT
  - CSCO
  - CVX
  - DIS
  - GS
  - HD
  - IBM
  - INTC
  - JNJ
  - JPM
  - KO
  - MCD
  - MMM
  - MRK
  - MSFT
  - NKE
  - PFE
  - PG
  - RTX
  - TRV
  - UNH
  - V
  - WMT
  - XOM

# --- Date ranges ---
start_date: '2008-01-01'
train_start: '2009-01-01'
train_end: '2015-12-31'
test_start: '2019-01-01'
test_end: '2020-12-31'

# --- Environment ---
turbulence_threshold: 200.0
technical_indicator_columns:
  - MACD
  - RSI
  - SO
  - FR

# --- Benchmark (buy-and-hold, used for PSR) ---
benchmark_source: "equal_weight"
benchmark_tickers:
  - AAPL
  - AXP
  - BA
  - BAC
  - CAT
  - CSCO
  - CVX
  - DIS
  - GS
  - HD
  - IBM
  - INTC
  - JNJ
  - JPM
  - KO
  - MCD
  - MMM
  - MRK
  - MSFT
  - NKE
  - PFE
  - PG
  - RTX
  - TRV
  - UNH
  - V
  - WMT
  - XOM

# --- LLM agents (optional — requires OPENROUTER_API_KEY) ---
llm_timesteps: 1
llm_openrouter_models:
  LLM_Gemini: "google/gemini-3-flash-preview"
  LLM_Gemma3: "google/gemma-3-27b-it"
  LLM_GPT: "openai/gpt-5.4"
  LLM_Sonnet: "anthropic/claude-sonnet-4.6"
llm_agent_params:
  api_key_env_var: "OPENROUTER_API_KEY"
  verbose: 1
  max_request_retries: 10
  temperature: 0.1
  max_tokens: 160
  timeout_seconds: 30
  max_api_calls: 2000
  log_every_n_steps: 25
  blind_mode: false

# --- S3 export ---
upload_to_s3_base_path: 's3://some-leaderboard'
