[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stare"
version = "0.1.0"
description = "STARE: Statistical Testing of Algorithmic Robustness in Evaluation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "yfinance>=0.2.18",
    "pandas-ta",
    "gymnasium>=0.28.1",
    "stable-baselines3[extra]>=2.0.0",
    "torch>=2.0.0",
    "scipy>=1.10.0",
    "PyYAML>=6.0",
    "optuna>=3.0.0",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-mock", "boto3"]
all = ["shap>=0.40.0", "quantstats>=0.0.64"]

[tool.setuptools.packages.find]
include = ["evaluation*", "data*", "envs*", "agents*", "tuning*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/results"]
